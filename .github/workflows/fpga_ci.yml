name: FPGA Build & Release Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl zip

      - name: Run VHDL Syntax Verification
        run: |
          echo "Checking only non-empty VHDL files..."
          for file in fpga/src/*.vhd; do
            if [ -s "$file" ]; then
              echo "Compiling $file..."
              ghdl -s "$file"
            else
              echo "Skipping empty file $file"
            fi
          done

      - name: Package Firmware
        run: |
          mkdir -p build_output
          zip -r build_output/fpga_firmware_release.zip fpga/src/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fpga-bitstream-pack
          path: build_output/fpga_firmware_release.zip
